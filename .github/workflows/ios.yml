# Builds the iOS app from the same frontend as the website, on GitHub's Macs: nobody needs a Mac of their own.
# Every run builds it for the simulator (it proves the app compiles, and any Mac can open it). Once the App Store
# signing secrets are in place (ADR-045, docs/mobile.md) it is also archived for real iPhones, signed with the Apple
# Distribution certificate, exported as an .ipa and, from main, handed to App Store Connect for TestFlight.
name: iOS app

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned, like the Android build: a build machine changing underneath is a surprise.
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      # The same public build settings as the website and the Android app (Settings → Secrets and variables → Actions
      # → Variables). They end up inside the app, so none of them is a secret.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      # The app's pages come from capacitor://localhost, and WebKit sends no Referer from there: a MapTiler key that
      # only allows listed origins answers "Invalid key". VITE_MAP_TILE_URL_IOS, when set, is the URL with a key meant
      # for the app (see docs/mobile.md); otherwise the website's is used.
      VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL_IOS || vars.VITE_MAP_TILE_URL }}
      VITE_MAP_ATTRIBUTION: ${{ vars.VITE_MAP_ATTRIBUTION }}
      # Notifications go through Firebase, as on Android (ADR-039). Set from the same condition that writes
      # GoogleService-Info.plist below, so the app never offers notifications it was not built to receive.
      VITE_PUSH_NATIVE: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST != '' && '1' || '' }}
      # Not a secret: it is in the website's apple-app-site-association too. The profile must belong to this team.
      APPLE_TEAM_ID: AGXG273RG9
      # Secrets can't be tested in `if:` directly; these say which ones are configured.
      HAS_IOS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
      HAS_APP_STORE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' && secrets.APP_STORE_CONNECT_API_KEY_ID != '' && secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the build settings are there
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_API_BASE_URL; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository variable $name (Settings → Secrets and variables → Actions → Variables)"; exit 1; fi
          done
          case "$VITE_API_BASE_URL" in https://*) ;; *) echo "::error::VITE_API_BASE_URL must be a full https:// address inside the app"; exit 1;; esac

      - name: Use the newest stable Xcode on the machine
        run: |
          # Capacitor follows Apple's current Xcode closely; the image's default is often one release behind.
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web app
        run: npm ci && npm run build

      - name: Copy it into the iOS project
        run: npx cap sync ios

      - name: Add the Firebase settings the app needs for notifications
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          # Not kept in the repository, like Android's google-services.json. The project always includes the file, so
          # without the secret an empty one goes in: the app then starts without Firebase and offers no notifications.
          target=ios/App/App/GoogleService-Info.plist
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::warning::No IOS_GOOGLE_SERVICE_INFO_PLIST secret: this build has no notifications."
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict/></plist>' > "$target"
          else
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$target"
            plutil -lint "$target" || { echo "::error::IOS_GOOGLE_SERVICE_INFO_PLIST is not a valid plist"; exit 1; }
            grep -q '<string>com.bouldertime.app</string>' "$target" \
              || { echo "::error::IOS_GOOGLE_SERVICE_INFO_PLIST belongs to another app: its BUNDLE_ID must be com.bouldertime.app"; exit 1; }
          fi

      - name: Build the app for the simulator (unsigned)
        working-directory: frontend/ios/App
        run: |
          version=$(node -p "require('../../package.json').version")
          xcodebuild \
            -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -40   # the step runs with pipefail, so a failed build still fails it
          mkdir -p ../../../out
          (cd build/Build/Products/Release-iphonesimulator && ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/out/BoulderTime-${version}-${{ github.run_number }}-simulator.zip")

      - uses: actions/upload-artifact@v5
        with:
          name: BoulderTime-ios-simulator-${{ github.run_number }}
          path: out/*.zip
          retention-days: 30

      # ---- App Store: only once the signing secrets exist (Settings → Secrets and variables → Actions) ----

      - name: Explain why there is no App Store build
        if: env.HAS_IOS_SIGNING != 'true'
        run: echo "::notice::No IOS_DIST_CERT_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 secrets, so this run builds for the simulator only."

      - name: Install the distribution certificate and the App Store profile
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A keychain of its own for this run, with a password made up on the spot: nothing to store, nothing to leak.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          if ! security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; then
            rm -f "$RUNNER_TEMP/dist.p12"
            echo "::error::IOS_DIST_CERT_P12_BASE64 or IOS_DIST_CERT_PASSWORD is wrong (or the .p12 was made without -legacy)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution"; then
            echo "::error::The certificate in IOS_DIST_CERT_P12_BASE64 is not an Apple Distribution certificate"
            exit 1
          fi
          echo "BT_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          # The profile is checked before use, so a wrong one fails here with a reason, not later inside codesign.
          profile="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null; }
          fail() { echo "::error::$1"; exit 1; }
          [ "$(pb TeamIdentifier:0)" = "$APPLE_TEAM_ID" ] || fail "The profile belongs to team $(pb TeamIdentifier:0), not $APPLE_TEAM_ID"
          [ "$(pb Entitlements:application-identifier)" = "$APPLE_TEAM_ID.com.bouldertime.app" ] \
            || fail "The profile is for $(pb Entitlements:application-identifier), not $APPLE_TEAM_ID.com.bouldertime.app"
          if pb ProvisionedDevices > /dev/null; then fail "The profile lists devices: it is a development or ad-hoc profile, not an App Store one"; fi
          [ "$(pb Entitlements:aps-environment)" = "production" ] \
            || fail "The profile has no production push: turn on Push Notifications for the App ID, then make the profile again"
          pb Entitlements:com.apple.developer.associated-domains > /dev/null \
            || fail "The profile has no Associated Domains: turn them on for the App ID, then make the profile again"
          uuid=$(pb UUID)
          # Xcode 16 reads profiles from UserData, older Xcodes from MobileDevice: both, so either works.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir" && cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "BT_PROFILE_NAME=$(pb Name)" >> "$GITHUB_ENV"
          echo "BT_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "Profile \"$(pb Name)\", valid until $(pb ExpirationDate)"

      - name: Archive the app for iPhones
        if: env.HAS_IOS_SIGNING == 'true'
        working-directory: frontend/ios/App
        run: |
          version=$(node -p "require('../../package.json').version")
          # Signing comes from the project's Release settings of the App target alone (Apple Distribution, manual, this
          # team, the profile named here). Given on the command line it would reach the Swift packages too, and they
          # refuse a provisioning profile.
          xcodebuild \
            -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            BT_PROFILE_NAME="$BT_PROFILE_NAME" OTHER_CODE_SIGN_FLAGS="--keychain $BT_KEYCHAIN" \
            archive | tail -60   # the step runs with pipefail, so a failed archive still fails it

      - name: Export the signed .ipa
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          name="BoulderTime-${version}-${{ github.run_number }}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.bouldertime.app</key><string>$BT_PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tail -20
          mkdir -p ../out
          cp "$RUNNER_TEMP"/export/*.ipa "../out/$name.ipa"
          (cd "$RUNNER_TEMP/App.xcarchive" && ditto -c -k --keepParent dSYMs "$GITHUB_WORKSPACE/out/$name-dSYMs.zip")
          # The bundle id App Store Connect will see: it must stay com.bouldertime.app.
          unzip -p "../out/$name.ipa" 'Payload/App.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          bundle=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_TEMP/Info.plist")
          [ "$bundle" = "com.bouldertime.app" ] || { echo "::error::The .ipa says $bundle, not com.bouldertime.app"; exit 1; }
          echo "Signed $name.ipa for com.bouldertime.app"

      - uses: actions/upload-artifact@v5
        if: env.HAS_IOS_SIGNING == 'true'
        with:
          name: BoulderTime-ios-appstore-${{ github.run_number }}
          path: |
            out/*.ipa
            out/*-dSYMs.zip
          retention-days: 14

      # Only main goes to App Store Connect. From there it is TestFlight: internal testers get it once Apple has
      # processed it; releasing to everyone stays a deliberate step in App Store Connect.
      - name: Hand the app to App Store Connect (TestFlight)
        if: env.HAS_IOS_SIGNING == 'true' && env.HAS_APP_STORE_KEY == 'true' && github.ref == 'refs/heads/main'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # altool finds the key by its id in this folder, which lives in the run's temp space and is removed below.
          keys="$RUNNER_TEMP/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$API_KEY_P8" > "$keys/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$keys/AuthKey_${API_KEY_ID}.p8"
          ipa=$(ls ../out/*.ipa)
          API_PRIVATE_KEYS_DIR="$keys" xcrun altool --upload-app -t ios -f "$ipa" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Remove the keychain, the profile and the API key
        if: always() && env.HAS_IOS_SIGNING == 'true'
        run: |
          if [ -n "${BT_KEYCHAIN:-}" ]; then security delete-keychain "$BT_KEYCHAIN" || true; fi
          if [ -n "${BT_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$BT_PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/MobileDevice/Provisioning Profiles/$BT_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/dist.p12"
