# Builds the Android app from the same frontend as the website, on GitHub's machines: nobody needs Android Studio.
# Every run leaves an installable APK under the run's "Artifacts", and, once Google Play is connected, hands the app
# bundle to a Play testing track (ADR-040). Production stays a click in Play Console.
name: Android app

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest moves to a new release on its own, and a build machine changing underneath is a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # Public build settings, the same ones Cloudflare uses for the website (Settings → Secrets and variables →
      # Actions → Variables). They end up inside the app, so none of them is a secret.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL }}
      VITE_MAP_ATTRIBUTION: ${{ vars.VITE_MAP_ATTRIBUTION }}
      # Secrets can't be tested in `if:` directly; this says whether the signing key is configured.
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # Read by the web build, and set from the same condition that writes google-services.json below, so the app can
      # never offer notifications it was not built to receive — asking the plugin would crash it.
      VITE_PUSH_NATIVE: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the build settings are there
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_API_BASE_URL; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository variable $name (Settings → Secrets and variables → Actions → Variables)"; exit 1; fi
          done
          case "$VITE_API_BASE_URL" in https://*) ;; *) echo "::error::VITE_API_BASE_URL must be a full https:// address inside the app"; exit 1;; esac

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web app
        run: npm ci && npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Add the Firebase settings the app needs for notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          # Not kept in the repository: it names the Firebase project, and the repository is public. Without it the
          # app still builds — Capacitor simply leaves notifications out — so say so rather than failing quietly.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::No ANDROID_GOOGLE_SERVICES_JSON secret: this build has no notifications."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" \
            || { echo "::error::ANDROID_GOOGLE_SERVICES_JSON is not valid JSON"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Unpack the signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "BT_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: frontend/android
        env:
          BT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export BT_VERSION_NAME=$(node -p "require('../package.json').version")
          export BT_VERSION_CODE=${{ github.run_number }}
          name="BoulderTime-${BT_VERSION_NAME}-${BT_VERSION_CODE}"
          mkdir -p ../../out
          if [ -n "${BT_KEYSTORE_PATH:-}" ]; then
            # Signed with the upload key: installs over the previous build, and is what Google Play receives.
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../../out/${name}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../../out/${name}.aab"
          else
            echo "::warning::No signing key configured: building a debug APK, which can't update a previously installed build."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../../out/${name}-debug.apk"
          fi

      - name: Check the key matches the one bouldertime.com vouches for
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          # If these differ, App Links silently stop working: links open in the browser instead of the app.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          signed=$("$apksigner" verify --print-certs ../out/*.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          declared=$(node -p "require('./public/.well-known/assetlinks.json')[0].target.sha256_cert_fingerprints.map(f => f.replace(/:/g,'').toLowerCase()).join(' ')")
          echo "Signed with: $signed"
          case " $declared " in *" $signed "*) echo "Matches assetlinks.json." ;; *) echo "::error::The APK's signing key ($signed) is not in public/.well-known/assetlinks.json"; exit 1 ;; esac

      - name: Remove the signing key
        if: always() && env.HAS_SIGNING_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: BoulderTime-android-${{ github.run_number }}
          path: |
            out/*.apk
            out/*.aab
          retention-days: 30

      # Only builds of main signed with the upload key go to Google Play, and only into a testing track: which one is the
      # repository variable PLAY_TRACK (internal unless set). Releasing to everyone stays a deliberate "Promote" in
      # Play Console. Without the PLAY_SERVICE_ACCOUNT_JSON secret this step is skipped and the build is as before.
      - name: Refuse to release to everyone from here
        if: vars.PLAY_TRACK == 'production'
        run: |
          echo "::error::PLAY_TRACK is 'production'. Builds only go to testing tracks; promote a tested release in Play Console instead."
          exit 1

      - name: Hand the app to Google Play
        if: env.HAS_SIGNING_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bouldertime.app
          releaseFiles: out/*.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          # "completed" makes the build available to the track's testers at once. A Play app that has never had any
          # release out yet only accepts "draft": set the variable PLAY_RELEASE_STATUS to draft in that case.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: build ${{ github.run_number }}
